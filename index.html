<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
<title>Masuk – PALASENA</title></head>
<body><div class="login">
  <button type="button" class="icon-btn theme-fixed" data-theme-btn></button>
  <section class="login-art">
    <div id="hero" class="hero"></div>
    <div class="brandblock">
      <img src="/logo.png" alt="Logo PALASENA">
      <h1 class="brand">PALASENA</h1><div class="mut">Organisasi Pencinta Alam</div>
    </div>
  </section>
  <section class="login-form">
    <div class="card">
      <div class="tabs"><button type="button" class="sm" id="tLogin">Masuk</button><button type="button" class="sm ghost" id="tReg">Daftar</button></div>
      <form id="f">
        <div id="regOnly" class="hide"><label>Nama lengkap</label><input id="nama" autocomplete="name"></div>
        <label>Username</label><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label>Password</label><input id="pw" type="password" autocomplete="current-password" required>
        <div class="mut hide" id="note" style="margin-top:10px">Akun baru otomatis menjadi anggota aktif. Jabatan pengurus diatur oleh admin atau Ketua Umum.</div>
        <div class="err" id="err"></div>
        <button type="submit" id="go">Masuk</button>
      </form>
    </div>
    <button class="ghost hide" id="install">Install Aplikasi</button>
  </section>
</div>
<script src="/hero.js"></script>
<script>
let mode='login';
const $=i=>document.getElementById(i);
function setMode(m){
  mode=m;
  $('regOnly').classList.toggle('hide',m==='login');
  $('note').classList.toggle('hide',m==='login');
  $('go').textContent=m==='login'?'Masuk':'Daftar';
  $('tLogin').classList.toggle('ghost',m!=='login');
  $('tReg').classList.toggle('ghost',m==='login');
  $('pw').autocomplete=m==='login'?'current-password':'new-password';
  $('err').textContent='';
}
$('tLogin').onclick=()=>setMode('login');
$('tReg').onclick=()=>setMode('register');
$('f').onsubmit=async e=>{
  e.preventDefault();
  const body={username:$('username').value.trim().toLowerCase(),password:$('pw').value};
  if(mode==='register')body.nama=$('nama').value;
  const r=await fetch('/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  if(r.ok)location.href='/dashboard.html'; else $('err').textContent=d.error||'Terjadi kesalahan';
};
fetch('/api/me').then(r=>{if(r.ok)location.href='/dashboard.html'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').classList.remove('hide')});
$('install').onclick=async()=>{dp.prompt();await dp.userChoice;$('install').classList.add('hide')};
</script></body></html>
